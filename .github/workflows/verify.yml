name: Verify and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r skills/chatgpt-chat-to-html/scripts/requirements.txt
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: python examples/create_demo.py --output work/demo
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: python scripts/verify_skill.py
      - run: python scripts/package_bundle.py --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: agent-skill-${{ matrix.os }}
          path: dist/
